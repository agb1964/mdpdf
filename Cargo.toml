[package]
name = "mdpdf"
version = "0.3.3"
edition = "2024"
license = "MIT"
description = "Standalone Markdown to PDF converter with an embedded Typst compiler"
readme = "README.md"
publish = false

[[bin]]
name = "mdpdf"
path = "src/main.rs"

[lib]
name = "mdpdf"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
# Рендерер Mermaid (ТЗ §10.5). Версия точная: крейт вычисляет геометрию,
# попадающую в эталонные файлы, поэтому обновляется только явной задачей.
# `default-features = false` убирает CLI (clap) и PNG (resvg/usvg) — ТЗ §2.
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
pulldown-cmark = "=0.13.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
typst = "=0.15.1"
# PagedDocument живёт в typst-layout и наружу из typst не реэкспортируется.
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"

[dev-dependencies]
assert_cmd = "2"
lopdf = "0.44"
predicates = "3"
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
