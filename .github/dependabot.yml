# Обновление зависимостей отдельными PR.
#
# Typst-линия, Markdown parser и Mermaid renderer игнорируются намеренно: по
# ТЗ §6.2 и §10.5 их версии обновляются отдельной задачей с полным test suite
# и проверкой golden PDF.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typst
      - dependency-name: typst-layout
      - dependency-name: typst-pdf
      - dependency-name: pulldown-cmark
      - dependency-name: mermaid-rs-renderer

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
