name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # RUSTFLAGS на rustdoc не распространяется: без этой строки сломанные
  # интра-док-ссылки остаются предупреждением и CI их пропускает.
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --all-targets --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Docs
        run: cargo doc --no-deps

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Порог ТЗ (§17, §29) — 90% строк для markdown, ast и typst_gen.
      # cargo-llvm-cov умеет ронять сборку только по общему проценту, поэтому
      # gate стоит на нём, а помодульные цифры видны в выводе выше.
      - name: Coverage
        run: cargo llvm-cov --all-features --workspace --summary-only --fail-under-lines 90

  binary-size:
    name: release binary size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Report size
        run: ls -l target/release/mdpdf | awk '{print "release binary:", $5, "bytes"}'

  clean-environment:
    name: работает без Typst в системе
    runs-on: ubuntu-latest
    container: rust:slim
    steps:
      - uses: actions/checkout@v4
      - name: Никаких внешних инструментов не установлено
        run: |
          for tool in typst pandoc pdflatex chromium; do
            if command -v "$tool" >/dev/null; then
              echo "$tool must not be installed in this job"; exit 1
            fi
          done
      - run: cargo build --release
      - run: ./target/release/mdpdf --version
